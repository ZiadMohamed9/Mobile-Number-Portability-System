name: mnp

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MNP_DB_NAME:-mnp}
      MYSQL_USER: ${MNP_DB_USERNAME:-mnp}
      MYSQL_PASSWORD: ${MNP_DB_PASSWORD:?Set MNP_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MNP_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend/mnp
      dockerfile: Dockerfile
    environment:
      MNP_DB_URL: jdbc:mysql://mysql:3306/${MNP_DB_NAME:-mnp}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MNP_DB_USERNAME: ${MNP_DB_USERNAME:-mnp}
      MNP_DB_PASSWORD: ${MNP_DB_PASSWORD:?Set MNP_DB_PASSWORD in .env}
      MNP_NATIONAL_ID_HMAC_KEY: ${MNP_NATIONAL_ID_HMAC_KEY:?Set MNP_NATIONAL_ID_HMAC_KEY in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MNP_SERVER_PORT: 8080
      MNP_LOG_LEVEL: ${MNP_LOG_LEVEL:-INFO}
    ports:
      - "${MNP_SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
