<div class="decision-dialog">
  <h2>Accept this request?</h2>
  <p>The mobile number will be transferred to the recipient operator immediately.</p>
  <div class="decision-dialog__actions">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="button" (click)="confirm()">Accept request</button>
  </div>
</div>
