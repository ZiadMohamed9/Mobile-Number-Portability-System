spring:
  application:
    name: mnp

  datasource:
    url: ${MNP_DB_URL:jdbc:mysql://localhost:3306/mnp?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MNP_DB_USERNAME}
    password: ${MNP_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: ${MNP_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.fourgtss.mnp: ${MNP_LOG_LEVEL:INFO}
