<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/requests" aria-label="MNP Console requests">
      <span class="brand__mark" aria-hidden="true">MN</span>
      <span>MNP Console</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a
        routerLink="/numbers/new"
        [class.primary-nav__link--active]="isAddNumberActive()"
        class="primary-nav__link"
      >
        Add number
      </a>
      <a
        routerLink="/requests/new"
        [class.primary-nav__link--active]="isNewRequestActive()"
        class="primary-nav__link"
      >
        New request
      </a>
      <a
        routerLink="/requests"
        [class.primary-nav__link--active]="isRequestsActive()"
        class="primary-nav__link"
      >
        Requests
      </a>
    </nav>

    <div class="organization">
      <span class="organization__label">Organization</span>
      <strong>{{ organizationCode() }}</strong>
      <button mat-button type="button" (click)="changeOrganization()">Change</button>
    </div>
  </div>
</header>

<main class="app-content">
  <router-outlet />
</main>
